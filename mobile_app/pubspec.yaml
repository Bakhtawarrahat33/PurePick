version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.3+1
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.1
  google_mlkit_text_recognition: ^0.13.1
  google_sign_in: ^6.3.0
  http: ^1.6.0
